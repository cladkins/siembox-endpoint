name: release

# Builds native packages on each OS's own runner:
#   - Linux:   .deb / .rpm / archives  (goreleaser + nfpm)
#   - macOS:   .pkg                     (pkgbuild, universal binary)
#   - Windows: .msi                     (WiX)
#
# On a version tag (v*) the packages are attached to the GitHub Release.
# On pull_request / manual dispatch they are uploaded as workflow artifacts so
# the build can be verified without cutting a release.

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: ${{ startsWith(github.ref, 'refs/tags/') && 'release --clean' || 'release --snapshot --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: build .pkg + menu bar app
        run: |
          VERSION="0.0.0"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          echo "building version $VERSION"
          VERSION="$VERSION" bash packaging/darwin/build-pkg.sh
          VERSION="$VERSION" bash packaging/darwin/build-tray-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-pkg
          path: |
            dist/*.pkg
            dist/*.zip
      - name: attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.pkg
            dist/SIEMBox-Menu-Bar-*.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: build .msi
        shell: pwsh
        run: |
          $version = "0.0.0"
          if ($env:GITHUB_REF_TYPE -eq "tag") { $version = $env:GITHUB_REF_NAME -replace '^v','' }
          Write-Host "building version $version"
          packaging\windows\build-msi.ps1 -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: dist/*.msi
      - name: attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.msi

  # Publishes SHA256SUMS for the release. Agents self-update straight from the
  # GitHub release and refuse any release without this file, verifying every
  # downloaded asset against it. Runs only after every asset has been attached.
  checksums:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: write and upload SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir assets
          cd assets
          gh release download "$TAG" --dir .
          rm -f SHA256SUMS   # re-runs: never checksum a previous SHA256SUMS
          # The agent only accepts plain file names; fail the release loudly otherwise.
          if ls -1 | grep -qvE '^[A-Za-z0-9][A-Za-z0-9._+~-]*$'; then
            echo "asset with an unsupported file name:" >&2
            ls -1 | grep -vE '^[A-Za-z0-9][A-Za-z0-9._+~-]*$' >&2
            exit 1
          fi
          LC_ALL=C ls -1 | xargs -d '\n' sha256sum > ../SHA256SUMS
          cd ..
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber
